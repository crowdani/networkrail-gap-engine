# =============================================================================
# Gap Approval — KIE / jBPM Local Test Stack
# =============================================================================
# Uses quay.io/kiegroup/jbpm-server-full — the only publicly available
# community image. It bundles Business Central + KIE Server in one container.
# No Red Hat subscription or registry login required.
#
# KIE version: 7.74.1.Final (same engine as BAMOE 8)
# Credentials: admin / admin
#
# Prerequisites:
#   - The kjar built locally:
#       cd gap_engine/kie && mvn -s settings.xml clean install -DskipTests
#
# Usage:
#   cd gap_engine/kie
#   docker-compose up -d
#   # Business Central: http://localhost:8080/business-central  (admin / admin)
#   # KIE Server:       http://localhost:8080/kie-server/services/rest/server
#   # Both ports are on 8080 — KIE Server is embedded in the same WildFly instance.
# =============================================================================

services:

  # ── jBPM Server Full (Business Central + embedded KIE Server) ─────────────
  jbpm:
    image: quay.io/kiegroup/jbpm-server-full:7.74.0.Final
    container_name: gap-jbpm
    ports:
      - "8080:8080"
    environment:
      KIE_SERVER_BYPASS_AUTH_USER: "true"
      JAVA_OPTS: >-
        -Xms512m -Xmx1536m
        -Dorg.uberfire.nio.git.daemon.enabled=false
        -Dorg.uberfire.nio.git.ssh.enabled=false
    volumes:
      # Mount the local ~/.m2/repository so the embedded KIE Server can resolve the kjar
      - "${HOME}/.m2/repository:/root/.m2/repository:ro"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/business-central/rest/server"]
      interval: 30s
      retries: 12
      start_period: 90s
    # Create the wbadmin application user on every start (idempotent --silent)
    command: >
      bash -c "
        /opt/jboss/wildfly/bin/add-user.sh -a -u wbadmin -p 'wbadmin1!'
          -g 'admin,analyst,developer,manager,user,kie-server,kiemgmt,rest-all' --silent ;
        /opt/jboss/wildfly/bin/start_jbpm-wb.sh
      "

volumes: {}
