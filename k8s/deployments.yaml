---
# =============================================================================
# stomp-client  — STOMP → Kafka bridge
# Connects to publicdatafeeds.networkrail.co.uk:61618 and forwards
# all train movement messages to the Kafka topics in the cluster.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stomp-client
  namespace: networkrail-gap-engine
  labels:
    app: stomp-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stomp-client
  strategy:
    type: Recreate   # Only one instance — duplicate STOMP subscriptions cause duplication
  template:
    metadata:
      labels:
        app: stomp-client
    spec:
      restartPolicy: Always
      containers:
        - name: stomp-client
          image: image-registry.openshift-image-registry.svc:5000/networkrail-gap-engine/stomp-client:latest
          command: ["python", "main.py"]
          env:
            - name: NR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: networkrail-credentials
                  key: username
            - name: NR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: networkrail-credentials
                  key: password
            - name: KAFKA_BROKER
              value: "kafka-0.kafka.confluent.svc.cluster.local:9092"
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
