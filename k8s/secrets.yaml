---
# Network Rail STOMP feed credentials
# Replace <...> values before applying.
# Apply with:  oc apply -f k8s/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: networkrail-credentials
  namespace: networkrail-gap-engine
type: Opaque
stringData:
  username: "<your-networkrail-username>"
  password: "<your-networkrail-password>"

---
# IBM watsonx.ai credentials (optional — services fall back gracefully without them)
apiVersion: v1
kind: Secret
metadata:
  name: watsonx-credentials
  namespace: networkrail-gap-engine
type: Opaque
stringData:
  api-key:    "<your-watsonx-api-key>"
  project-id: "<your-watsonx-project-id>"
  url:        "https://us-south.ml.cloud.ibm.com"

---
# JDBC Sink connector credentials for the predicted-gaps-postgresql-sink connector.
# The connector reads these from a mounted properties file at:
#   /opt/kafka/secrets/predicted-gaps-sink.properties
# The KafkaConnect CR (or worker configmap) must mount this secret as a volume.
apiVersion: v1
kind: Secret
metadata:
  name: predicted-gaps-sink-credentials
  namespace: confluent
type: Opaque
stringData:
  predicted-gaps-sink.properties: |
    connection.url=jdbc:postgresql://postgresql.networkrail-gap-engine.svc:5432/network_rail
    connection.user=postgres
    connection.password=postgres

---
# Next.js auth secret — must be a random 32+ char string
# Generate one with:  openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: nextjs-auth
  namespace: networkrail-gap-engine
type: Opaque
stringData:
  auth-secret: "<openssl rand -hex 32 output here>"
