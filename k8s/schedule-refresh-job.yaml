                      key: password
                - name: POSTGRES_HOST
                  value: "postgresql.networkrail-gap-engine.svc"
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: postgresql
                      key: database-name
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgresql
                      key: database-user
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgresql
                      key: database-password
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work-dir
                  mountPath: /work
              resources:
                requests:
                  memory: "2Gi"
                  cpu: "1000m"
