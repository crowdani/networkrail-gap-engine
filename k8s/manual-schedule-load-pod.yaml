apiVersion: v1
kind: Pod
metadata:
  name: manual-schedule-loader
  namespace: networkrail-gap-engine
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: python:3.11-slim
      command: ["python3", "/scripts/run_refresh.py"]
      env:
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: networkrail-credentials
              key: username
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: networkrail-credentials
              key: password
        - name: POSTGRES_HOST
          value: "postgresql.networkrail-gap-engine.svc"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: database-name
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: database-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: database-password
      volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: work-dir
          mountPath: /work
      resources:
        requests:
          memory: "2Gi"
          cpu: "1000m"
        limits:
          memory: "4Gi"
          cpu: "2000m"
  volumes:
    - name: scripts
      configMap:
        name: schedule-refresh-script
        defaultMode: 0755
    - name: work-dir
      emptyDir:
        sizeLimit: 10Gi
