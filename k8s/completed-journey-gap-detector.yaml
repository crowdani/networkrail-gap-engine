apiVersion: apps/v1
kind: Deployment
metadata:
  name: completed-journey-gap-detector
  namespace: networkrail-gap-engine
  labels:
    app: completed-journey-gap-detector
    component: stream-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: completed-journey-gap-detector
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: completed-journey-gap-detector
        component: stream-processor
    spec:
      restartPolicy: Always
      containers:
        - name: completed-journey-gap-detector
          image: image-registry.openshift-image-registry.svc:5000/networkrail-gap-engine/completed-journey-gap-detector:latest
          imagePullPolicy: Always
          command: ["python3", "-u", "completed_journey_gap_detector.py"]
          env:
            - name: KAFKA_BROKER
              value: "kafka.confluent.svc.cluster.local:9092"
            - name: INPUT_TOPIC
              value: "COMPLETED_JOURNEYS"
            - name: OUTPUT_TOPIC
              value: "NR_JOURNEY_GAPS"
            - name: CONSUMER_GROUP
              value: "completed-journey-gap-detector-v3"
            - name: AUTO_OFFSET_RESET
              value: "earliest"
            - name: POSTGRES_HOST
              value: "postgresql.networkrail-gap-engine.svc"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: database-name
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: database-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: database-password
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 300m
